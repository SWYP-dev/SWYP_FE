# CI (docs/workflow/claude-codex-plan.md 0장 #5·#6)
#
# pr-validation.yml이 workflow_call로 호출하고, develop push에서도 실행해 통합 상태를 본다.
# - typecheck·build·lint: 모두 필수. 하나라도 실패하면 ci 잡이 실패하고 pr-gate가 막는다
#   (lint는 기존 오류 정리(LINT-0001, #208) 후 필수로 올렸다)
#
# 필수 잡의 npm 명령은 scripts/ai/spec-file.mjs의 CI_COMMANDS와 같아야 한다 (spec-check.test.mjs가 대조한다).
# 잡을 추가·삭제하거나 continue-on-error로 바꿀 때는 CI_COMMANDS와 대조 테스트를 한 PR에서 함께 고친다.
name: CI

on:
  workflow_call:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run build

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run lint
